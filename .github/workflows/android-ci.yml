name: Android CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests, lint, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  instrumentation:
    name: Instrumentation API ${{ matrix.api-level }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS:="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

  release-bundle:
    name: Minified release bundle
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    needs: [quality, instrumentation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create ephemeral validation key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-upload.jks" \
            -storepass android -keypass android -alias ci-upload \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Validation,OU=CI,O=FreddyFridge,L=Rome,C=IT"
      - name: Build release bundle
        env:
          FREDDY_UPLOAD_STORE_FILE: ${{ runner.temp }}/ci-upload.jks
          FREDDY_UPLOAD_STORE_PASSWORD: android
          FREDDY_UPLOAD_KEY_ALIAS: ci-upload
          FREDDY_UPLOAD_KEY_PASSWORD: android
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ephemeral-signed-release-validation
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 7

  publish-internal:
    name: Publish to Google Play Internal
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (
        (
          github.event_name == 'push' &&
          github.event.created == true &&
          github.event.deleted == false &&
          github.event.forced == false
        ) ||
        github.event_name == 'workflow_dispatch'
      )
    needs: [quality, instrumentation]
    environment: production-release
    permissions: { contents: read }
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: fastlane
      - name: Verify release credentials are configured
        env:
          HAS_UPLOAD_KEYSTORE: ${{ secrets.FREDDY_UPLOAD_KEYSTORE_BASE64 != '' }}
          HAS_UPLOAD_STORE_PASSWORD: ${{ secrets.FREDDY_UPLOAD_STORE_PASSWORD != '' }}
          HAS_UPLOAD_KEY_ALIAS: ${{ secrets.FREDDY_UPLOAD_KEY_ALIAS != '' }}
          HAS_UPLOAD_KEY_PASSWORD: ${{ secrets.FREDDY_UPLOAD_KEY_PASSWORD != '' }}
          HAS_GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA != '' }}
          HAS_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: |
          if [[ "$HAS_UPLOAD_KEYSTORE" != true \
            || "$HAS_UPLOAD_STORE_PASSWORD" != true \
            || "$HAS_UPLOAD_KEY_ALIAS" != true \
            || "$HAS_UPLOAD_KEY_PASSWORD" != true \
            || "$HAS_GOOGLE_PLAY_JSON_KEY_DATA" != true \
            || "$HAS_GOOGLE_SERVICES_JSON" != true ]]; then
            echo "::error::Required Google Play release credentials are not configured."
            exit 1
          fi
      - name: Decode upload keystore
        env:
          FREDDY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.FREDDY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$FREDDY_UPLOAD_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/freddy-upload.jks"
          chmod 600 "$RUNNER_TEMP/freddy-upload.jks"
      - name: Decode Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode > app/google-services.json
          chmod 600 app/google-services.json
      - name: Validate Firebase configuration
        run: >-
          ruby -r ./fastlane/release_support.rb -e
          'FreddyRelease::Support.new(project_root: Dir.pwd).validate_firebase_configuration!("app/google-services.json")'
      - name: Build and publish Internal release
        env:
          BUNDLE_GEMFILE: fastlane/Gemfile
          FREDDY_UPLOAD_STORE_FILE: ${{ runner.temp }}/freddy-upload.jks
          FREDDY_UPLOAD_STORE_PASSWORD: ${{ secrets.FREDDY_UPLOAD_STORE_PASSWORD }}
          FREDDY_UPLOAD_KEY_ALIAS: ${{ secrets.FREDDY_UPLOAD_KEY_ALIAS }}
          FREDDY_UPLOAD_KEY_PASSWORD: ${{ secrets.FREDDY_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bundle exec fastlane android release_internal
      - name: Create AAB checksum
        run: sha256sum app/build/outputs/bundle/release/app-release.aab > app-release.aab.sha256
      - name: Verify release artifacts
        run: |
          for artifact in \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/mapping/release/mapping.txt \
            app-release.aab.sha256; do
            if [[ ! -s "$artifact" ]]; then
              echo "::error file=$artifact::Required release artifact is missing or empty."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-play-internal-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary release credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/freddy-upload.jks"
          rm -f app/google-services.json
