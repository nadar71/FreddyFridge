name: Android CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Unit tests, lint, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  instrumentation:
    name: Instrumentation API ${{ matrix.api-level }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS:="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

  release-bundle:
    name: Minified release bundle
    if: github.event_name != 'pull_request'
    needs: [quality, instrumentation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create ephemeral validation key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-upload.jks" \
            -storepass android -keypass android -alias ci-upload \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Validation,OU=CI,O=FreddyFridge,L=Rome,C=IT"
      - name: Build release bundle
        env:
          FREDDY_UPLOAD_STORE_FILE: ${{ runner.temp }}/ci-upload.jks
          FREDDY_UPLOAD_STORE_PASSWORD: android
          FREDDY_UPLOAD_KEY_ALIAS: ci-upload
          FREDDY_UPLOAD_KEY_PASSWORD: android
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ephemeral-signed-release-validation
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 7
